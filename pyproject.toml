[build-system]
requires = ["hatchling>=1.27,<1.28"]
build-backend = "hatchling.build"

[project]
name = "mitra-functions-sdk"
version = "0.1.0"
description = "Mitra Platform SDK for Python Server Functions"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mitra Platform" }]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28.1,<1",
]

[project.urls]
Homepage = "https://github.com/mitralab-dev/mitra-functions-sdk-python"
Repository = "https://github.com/mitralab-dev/mitra-functions-sdk-python"
Issues = "https://github.com/mitralab-dev/mitra-functions-sdk-python/issues"

[project.optional-dependencies]
test = [
    "build>=1.2,<2",
    "mypy>=1.15,<2",
    "pytest>=9.0.3,<10",
    "pytest-cov>=6,<7",
    "ruff>=0.11,<1",
    "twine>=6,<8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mitra_functions_sdk"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/scripts",
    "/tests",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
    "/pyproject.toml",
]

[tool.pytest.ini_options]
addopts = "--cov=mitra_functions_sdk --cov-report=term-missing --cov-fail-under=80"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
